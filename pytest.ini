[pytest]
markers =
    integration: real I/O against infra/docker-compose.integration.yml (Redis, YugabyteDB, Immudb, Kafka, MinIO) -- not mocked, skipped automatically if the stack isn't up. See tests/integration/conftest.py.
    cut1: Cut 1 — Temporal + Kafka + OCR + YugabyteDB + Immudb
    cut2: Cut 2 — Kafka + Redis + OCR (no Temporal, no DB)
    cut3: Cut 3 — Temporal + Redis + OCR + YugabyteDB + Immudb (no Kafka)
