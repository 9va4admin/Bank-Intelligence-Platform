<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CTS Data Dictionary</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* ── Tokens ─────────────────────────────────────────────────────────────── */
:root {
  --bg:         #0f1117;
  --surf1:      #181d26;
  --surf2:      #1e2435;
  --border:     #2d3548;
  --border-sub: #232a3a;
  --text:       #dce3f0;
  --muted:      #8694b0;
  --faint:      #4e5a78;
  --accent:     #4c9aff;
  --accent-bg:  rgba(76,154,255,.12);
  --green:      #26a641;
  --green-bg:   rgba(38,166,65,.12);
  --red:        #e5534b;
  --red-bg:     rgba(229,83,75,.14);
  --amber:      #c69026;
  --amber-bg:   rgba(198,144,38,.13);
  --read-bg:    rgba(76,154,255,.15);
  --read-text:  #7ab8ff;
  --write-bg:   rgba(198,144,38,.18);
  --write-text: #e0a84a;
  --mono:       'JetBrains Mono', 'Fira Code', monospace;
  --sans:       'Inter', system-ui, -apple-system, sans-serif;
  --r:          6px;
  --topbar-h:   52px;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:         #f5f7fa;
    --surf1:      #ffffff;
    --surf2:      #eef1f7;
    --border:     #cdd4e0;
    --border-sub: #dde3ee;
    --text:       #1a2035;
    --muted:      #536080;
    --faint:      #94a3b8;
    --accent:     #1a6ccc;
    --accent-bg:  rgba(26,108,204,.09);
    --green:      #1a7f2e;
    --green-bg:   rgba(26,127,46,.09);
    --red:        #c0392b;
    --red-bg:     rgba(192,57,43,.09);
    --amber:      #8a5c00;
    --amber-bg:   rgba(138,92,0,.09);
    --read-bg:    rgba(26,108,204,.10);
    --read-text:  #1a6ccc;
    --write-bg:   rgba(138,92,0,.12);
    --write-text: #7a4e00;
  }
}
:root[data-theme="dark"] {
  --bg:         #0f1117;
  --surf1:      #181d26;
  --surf2:      #1e2435;
  --border:     #2d3548;
  --border-sub: #232a3a;
  --text:       #dce3f0;
  --muted:      #8694b0;
  --faint:      #4e5a78;
  --accent:     #4c9aff;
  --accent-bg:  rgba(76,154,255,.12);
  --green:      #26a641;
  --green-bg:   rgba(38,166,65,.12);
  --red:        #e5534b;
  --red-bg:     rgba(229,83,75,.14);
  --amber:      #c69026;
  --amber-bg:   rgba(198,144,38,.13);
  --read-bg:    rgba(76,154,255,.15);
  --read-text:  #7ab8ff;
  --write-bg:   rgba(198,144,38,.18);
  --write-text: #e0a84a;
}

/* ── Reset / base ─────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; scroll-behavior: smooth; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  line-height: 1.55;
  min-height: 100vh;
}

/* ── Topbar ───────────────────────────────────────────────────────────── */
#topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  height: var(--topbar-h);
  background: var(--surf1);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 14px;
  padding: 0 18px;
}
#topbar h1 {
  font-size: .875rem; font-weight: 700; letter-spacing: .03em;
  color: var(--text); white-space: nowrap; flex-shrink: 0;
}
#topbar h1 span { color: var(--accent); }
#search-wrap { flex: 1; max-width: 420px; position: relative; }
#search {
  width: 100%; height: 30px;
  background: var(--surf2); border: 1px solid var(--border);
  border-radius: var(--r); color: var(--text);
  font-family: var(--mono); font-size: .78rem;
  padding: 0 10px 0 30px; outline: none;
}
#search:focus { border-color: var(--accent); }
#search-icon {
  position: absolute; left: 9px; top: 50%; transform: translateY(-50%);
  width: 14px; height: 14px; color: var(--faint); pointer-events: none;
}
#stats-line { margin-left: auto; font-size: .75rem; color: var(--muted); white-space: nowrap; }
#theme-btn {
  background: var(--surf2); border: 1px solid var(--border);
  border-radius: var(--r); width: 28px; height: 28px;
  color: var(--muted); cursor: pointer; font-size: .9rem; flex-shrink: 0;
  display: grid; place-items: center;
}
#theme-btn:hover { color: var(--text); }

/* ── Layout ───────────────────────────────────────────────────────────── */
#layout {
  display: flex;
  margin-top: var(--topbar-h);
}
#sidebar {
  width: 228px; flex-shrink: 0;
  position: sticky; top: var(--topbar-h);
  height: calc(100vh - var(--topbar-h));
  overflow-y: auto; overflow-x: hidden;
  border-right: 1px solid var(--border);
  padding: 14px 0;
}
#sidebar::-webkit-scrollbar { width: 4px; }
#sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.sidebar-group { margin-bottom: 6px; }
.sg-label {
  font-size: .65rem; font-weight: 700; letter-spacing: .1em;
  color: var(--faint); text-transform: uppercase;
  padding: 6px 16px 3px;
}
.sg-link {
  display: block; padding: 3px 16px 3px 14px;
  font-family: var(--mono); font-size: .74rem; color: var(--muted);
  text-decoration: none; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; border-left: 2px solid transparent;
}
.sg-link:hover { color: var(--text); }
.sg-link.phantom { color: var(--red); opacity: .8; }
.sg-link.phantom:hover { opacity: 1; }

#main {
  flex: 1; min-width: 0;
  padding: 22px 28px 60px;
}

/* ── Group header ─────────────────────────────────────────────────────── */
.group-section { margin-bottom: 8px; }
.group-title {
  font-size: .7rem; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--faint);
  padding: 22px 0 8px; border-bottom: 1px solid var(--border-sub);
  margin-bottom: 12px;
}
.group-title.phantom-group { color: var(--red); border-color: color-mix(in srgb, var(--red) 25%, transparent); }

/* ── Table card ───────────────────────────────────────────────────────── */
.tcard {
  background: var(--surf1);
  border: 1px solid var(--border);
  border-radius: var(--r);
  margin-bottom: 12px;
  overflow: hidden;
}
.tcard.phantom { border-color: color-mix(in srgb, var(--red) 40%, var(--border)); }

.tcard-head {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 11px 14px 10px;
  border-bottom: 1px solid var(--border-sub);
  background: var(--surf2);
}
.tname {
  font-family: var(--mono); font-size: .82rem; font-weight: 500;
  color: var(--accent); text-decoration: none;
}
.tcard.phantom .tname { color: var(--red); }
.badge {
  font-size: .62rem; font-weight: 700; letter-spacing: .06em;
  text-transform: uppercase; padding: 2px 7px;
  border-radius: 99px; border: 1px solid;
}
.badge-ok  { background: var(--green-bg); color: var(--green); border-color: color-mix(in srgb, var(--green) 35%, transparent); }
.badge-phantom { background: var(--red-bg); color: var(--red); border-color: color-mix(in srgb, var(--red) 35%, transparent); }
.badge-group {
  font-size: .62rem; font-weight: 600; color: var(--muted);
  background: transparent; border-color: var(--border);
}
.migration {
  margin-left: auto; font-family: var(--mono); font-size: .72rem;
  color: var(--faint); white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; max-width: 360px;
}

.tcard-body { padding: 11px 14px 13px; display: flex; flex-direction: column; gap: 9px; }

.section-label {
  font-size: .65rem; font-weight: 700; letter-spacing: .09em;
  text-transform: uppercase; color: var(--faint); margin-bottom: 4px;
}
.cols-grid {
  display: flex; flex-wrap: wrap; gap: 4px 8px;
}
.col-item {
  font-family: var(--mono); font-size: .73rem;
  background: var(--surf2); border: 1px solid var(--border-sub);
  border-radius: 4px; padding: 2px 7px;
}
.col-name { color: var(--text); }
.col-type { color: var(--muted); }
.col-pii { color: var(--amber); }

.callers { display: flex; flex-direction: column; gap: 3px; }
.caller-row { display: flex; align-items: flex-start; gap: 7px; flex-wrap: wrap; }
.caller-tag {
  font-size: .62rem; font-weight: 700; letter-spacing: .05em;
  text-transform: uppercase; padding: 2px 6px; border-radius: 3px;
  white-space: nowrap; flex-shrink: 0; margin-top: 1px;
}
.tag-read  { background: var(--read-bg);  color: var(--read-text); }
.tag-write { background: var(--write-bg); color: var(--write-text); }
.caller-files {
  font-family: var(--mono); font-size: .74rem;
  color: var(--muted); line-height: 1.7;
}
.caller-files span { color: var(--text); }
.caller-files span:not(:last-child)::after { content: ', '; color: var(--faint); }

.tnotes {
  font-size: .78rem; color: var(--muted); line-height: 1.6;
  padding: 8px 10px;
  background: var(--surf2); border-radius: 4px;
  border-left: 3px solid var(--border);
}
.tcard.phantom .tnotes { border-left-color: var(--red); }

/* ── No results ───────────────────────────────────────────────────────── */
#no-results {
  display: none; text-align: center; padding: 60px 20px;
  color: var(--muted); font-size: .9rem;
}

/* ── Responsive ────────────────────────────────────────────────────────── */
@media (max-width: 800px) {
  #sidebar { display: none; }
  #main { padding: 16px 14px 40px; }
  .migration { display: none; }
}
</style>
</head>

<div id="layout">

/* ─── Rendering ──────────────────────────────────────────────────────────── */
const ABBR = {
  "apps/api/routers/": "routers/",
  "modules/cts/workflows/activities/": "activities/",
  "modules/cts/workflows/": "workflows/",
  "modules/cts/vaults/": "vaults/",
  "modules/cts/": "cts/",
};
function shorten(p) {
  for (const [k,v] of Object.entries(ABBR)) {
    if (p.startsWith(k)) return '<span title="'+p+'">'+v+p.slice(k.length)+'</span>';
  }
  return '<span>'+p+'</span>';
}

function renderCols(cols) {
  return cols.map(([n,t,flag])=>{
    const pii = flag==="PII";
    return `<span class="col-item"><span class="col-name${pii?' col-pii':''}">${n}</span><span class="col-type"> ${t}</span></span>`;
  }).join('');
}

function renderCallers(label, arr, cls) {
  if (!arr || arr.length === 0) return '';
  return `<div class="caller-row">
    <span class="caller-tag ${cls}">${label}</span>
    <span class="caller-files">${arr.map(shorten).join(' ')}</span>
  </div>`;
}

function cardHTML(t) {
  const phantom = t.status === 'phantom';
  const groupLabel = GROUPS.find(g=>g.id===t.group)?.label ?? t.group;
  return `
<article class="tcard${phantom?' phantom':''}" id="${t.name.replace('.','-')}">
  <div class="tcard-head">
    <a class="tname" href="#${t.name.replace('.','-')}">${t.name}</a>
    <span class="badge ${phantom?'badge-phantom':'badge-ok'}">${phantom?'PHANTOM':'CONFIRMED'}</span>
    <span class="badge badge-group">${groupLabel}</span>
    <span class="migration">${t.migration}</span>
  </div>
  <div class="tcard-body">
    <div>
      <div class="section-label">Columns</div>
      <div class="cols-grid">${renderCols(t.cols)}</div>
    </div>
    <div class="callers">
      ${renderCallers('READ', t.readBy, 'tag-read')}
      ${renderCallers('WRITE', t.writeBy, 'tag-write')}
    </div>
    ${t.notes ? `<div class="tnotes">${t.notes}</div>` : ''}
  </div>
</article>`;
}

function buildSidebar() {
  const sb = document.getElementById('sidebar');
  GROUPS.forEach(g => {
    const tables = TABLES.filter(t=>t.group===g.id);
    if (tables.length === 0) return;
    const div = document.createElement('div');
    div.className = 'sidebar-group';
    div.innerHTML = `<div class="sg-label">${g.label}</div>` +
      tables.map(t=>`<a class="sg-link${t.status==='phantom'?' phantom':''}"
        href="#${t.name.replace('.','-')}">${t.name.replace('cts.','')}</a>`).join('');
    sb.appendChild(div);
  });
}

function buildMain(filter) {
  const main = document.getElementById('main');
  // Clear existing group sections
  main.querySelectorAll('.group-section').forEach(e=>e.remove());
  document.getElementById('no-results').style.display = 'none';

  const q = (filter||'').toLowerCase().trim();
  let total = 0;

  GROUPS.forEach(g => {
    let tables = TABLES.filter(t=>t.group===g.id);
    if (q) {
      tables = tables.filter(t =>
        t.name.toLowerCase().includes(q) ||
        t.migration.toLowerCase().includes(q) ||
        t.cols.some(c=>c[0].toLowerCase().includes(q)||c[1].toLowerCase().includes(q)) ||
        (t.readBy||[]).some(f=>f.toLowerCase().includes(q)) ||
        (t.writeBy||[]).some(f=>f.toLowerCase().includes(q)) ||
        (t.notes||'').toLowerCase().includes(q)
      );
    }
    if (tables.length === 0) return;
    total += tables.length;

    const sec = document.createElement('div');
    sec.className = 'group-section';
    const phantom = g.id === 'phantom';
    sec.innerHTML = `<div class="group-title${phantom?' phantom-group':''}">${g.label} — ${tables.length} table${tables.length!==1?'s':''}</div>` +
      tables.map(cardHTML).join('');
    main.appendChild(sec);
  });

  if (total === 0) document.getElementById('no-results').style.display = 'block';

  const confirmed = TABLES.filter(t=>t.status==='ok').length;
  const phantoms = TABLES.filter(t=>t.status==='phantom').length;
  document.getElementById('stats-line').textContent = q
    ? `${total} of ${TABLES.length} tables`
    : `${confirmed} confirmed · ${phantoms} phantom`;
}

buildSidebar();
buildMain('');

document.getElementById('search').addEventListener('input', e => buildMain(e.target.value));

// Theme toggle
const root = document.documentElement;
let darkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
function syncTheme() {
  root.setAttribute('data-theme', darkMode ? 'dark' : 'light');
  document.getElementById('theme-btn').textContent = darkMode ? '☀' : '🌙';
}
syncTheme();
document.getElementById('theme-btn').addEventListener('click', () => {
  darkMode = !darkMode; syncTheme();
});
</script>
