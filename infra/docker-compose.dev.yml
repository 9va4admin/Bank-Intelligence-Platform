# ASTRA Dev Infrastructure Stack
#
# Starts all platform services required for POC/local development.
# vLLM is intentionally absent — POC mode routes AI inference to HuggingFace API.
#
# Usage:
#   docker compose -f infra/docker-compose.dev.yml up -d
#   docker compose -f infra/docker-compose.dev.yml down -v   # wipe state
#
# Service names here match _DOCKER_SERVICE_MAP in apps/api/routers/platform.py
# exactly — the Go-Live Start buttons rely on these names.
#
# Host port assignments (all distinct, checked against common dev conflicts):
#   vault        8200
#   redis-cts    6379
#   redis-ej     6380
#   minio        9000 (S3 API)  9091 (Console)
#   immudb       3322 (gRPC)    9497 (metrics)
#   yugabyte     5433 (YSQL)   17000 (master UI)
#   kafka        9092
#   temporal     7233 (gRPC)    8088 (UI)

networks:
  astra-dev:
    driver: bridge

volumes:
  minio-data:
  immudb-data:
  yugabyte-data:

# ── Tier 1 — Foundation (no deps, start in parallel) ──────────────────────

services:

  vault:
    image: hashicorp/vault:1.15
    container_name: vault
    hostname: vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "astra-dev-root-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"
    cap_add: [IPC_LOCK]
    networks: [astra-dev]
    healthcheck:
      test: ["CMD-SHELL", "vault status -address=http://localhost:8200 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis-cts:
    image: redis:7.2-alpine
    container_name: redis-cts
    hostname: redis-cts
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    networks: [astra-dev]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis-ej:
    image: redis:7.2-alpine
    container_name: redis-ej
    hostname: redis-ej
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    networks: [astra-dev]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: minio
    hostname: minio
    command: server /data --console-address ":9091"
    environment:
      MINIO_ROOT_USER: astra-dev
      MINIO_ROOT_PASSWORD: astra-dev-secret
    ports:
      - "9000:9000"
      - "9091:9091"
    volumes:
      - minio-data:/data
    networks: [astra-dev]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  immudb:
    image: codenotary/immudb:1.9.5
    container_name: immudb
    hostname: immudb
    ports:
      - "3322:3322"
      - "9497:9497"
    volumes:
      - immudb-data:/var/lib/immudb
    networks: [astra-dev]
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3322 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15

# ── Tier 2 — Data layer (independent of Tier 1 startup, but must be up before Temporal) ──

  yugabyte:
    image: yugabytedb/yugabyte:2.20.1.0-b97
    container_name: yugabyte
    hostname: yugabyte
    command: >
      bash -c "bin/yugabyted start --daemon=false --background=false
      --listen=0.0.0.0 --master_flags='rpc_bind_addresses=0.0.0.0'
      --tserver_flags='pgsql_proxy_bind_address=0.0.0.0:5433'"
    ports:
      - "5433:5433"    # YSQL (PostgreSQL-compatible)
      - "17000:7000"   # Master UI (mapped to 17000 to avoid local conflicts)
    volumes:
      - yugabyte-data:/home/yugabyte/var
    networks: [astra-dev]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5433 -U yugabyte || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    hostname: kafka
    environment:
      # KRaft mode — no Zookeeper required
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # Advertise localhost so the FastAPI host process can connect via 9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "9092:9092"
    networks: [astra-dev]
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

# ── Tier 3 — Orchestration (Temporal requires YugabyteDB healthy) ──────────

  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: temporal
    hostname: temporal
    environment:
      DB: postgresql
      DB_PORT: "5433"
      POSTGRES_USER: yugabyte
      POSTGRES_PWD: yugabyte
      POSTGRES_SEEDS: yugabyte
      TEMPORAL_ADDRESS: "0.0.0.0:7233"
      TEMPORAL_BROADCAST_ADDRESS: "127.0.0.1"
      DEFAULT_NAMESPACE_RETENTION: "30"
      LOG_LEVEL: warn
    ports:
      - "7233:7233"
    networks: [astra-dev]
    depends_on:
      yugabyte:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 7233 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30

  temporal-ui:
    image: temporalio/ui:2.26.2
    container_name: temporal-ui
    hostname: temporal-ui
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: "http://localhost:8088"
    ports:
      - "8088:8080"
    networks: [astra-dev]
    depends_on:
      - temporal
