# ── Notifications ────────────────────────────────────────────────────────────
notifications:
  email:
    from_address: "astra-alerts@unionbankofindia.com"
    smtp_relay: "smtp.unionbankofindia.com"
  whatsapp:
    enabled: true

# ── Shared Services Scale ─────────────────────────────────────────────────────
api_gateway:
  replicas: 2
audit_service:
  replicas: 2
notification_service:
  replicas: 1

# ── Sub-Member Sponsorship ────────────────────────────────────────────────────
# Union Bank sponsors 1 UCB sub-member for CTS clearing (demo)
smb_sponsor_enabled: true
smb_sponsor_max_sub_members: 1

# Sub-member: Navi Mumbai Co-operative Bank Ltd.
smb_registry:
  - smb_id: smb-mh-nmcb
    name: "Navi Mumbai Co-operative Bank Ltd."
    short_name: "NM Co-op Bank"
    ifsc_prefix: NMCB
    micr_code: "400091001"
    city: "Navi Mumbai"
    state: MH
    daily_avg_cheques: 200
    integration_type: local

# ── MinIO Object Store ────────────────────────────────────────────────────────
minio:
  endpoint: "minio.astra-platform-union-bank.svc.cluster.local:9000"
  secure: false

# ── HSM ───────────────────────────────────────────────────────────────────────
hsm:
  transit_key_name: "astra-audit-key-union-bank"

# ── ASTRA Chart Version ───────────────────────────────────────────────────────
astra:
  platform_chart_version: "0.1.0"
