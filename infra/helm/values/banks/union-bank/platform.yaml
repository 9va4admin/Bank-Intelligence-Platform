# union-bank/platform.yaml — Layer 2 overrides for astra-platform chart.
# Bank: Union Bank of India — Public Sector Bank | Headquartered: Mumbai, Maharashtra
# Onboarded: August 2026 | Regulator: RBI | Demo: 2026-08-13
# ─────────────────────────────────────────────────────────────────────────────
# Changes require: PR to ASTRA repo → bank_it_admin approval → ArgoCD sync
# Audit trail: every merged PR triggers Immudb ConfigChangeEvent on apply
# ─────────────────────────────────────────────────────────────────────────────

bank_id: union-bank

global:
  bank_id: union-bank
  registry: registry.astra.internal

# ── Module Flags ─────────────────────────────────────────────────────────────
modules:
  cts:
    enabled: true
  ej:
    enabled: false                    # EJ not in scope for initial deployment

# ── CBS Connector ─────────────────────────────────────────────────────────────
# Union Bank of India runs Infosys Finacle core banking
cbs_connector_type: finacle

# ── Auth Connector Config ─────────────────────────────────────────────────────
auth:
  sb:
    integration_enabled: true
    integration_type: saml
    saml:
      idp_metadata_url_secret: "secret/astra/union-bank/auth/saml/sb/idp_metadata_url"
      sp_entity_id: "astra-sb-union-bank"
      acs_url: "https://api.union-bank.astra.internal/v1/auth/saml/acs"
      group_role_map:
        "ubi-cts-reviewer":   ops_reviewer
        "ubi-fraud-analyst":  fraud_analyst
        "ubi-ops-manager":    ops_manager
        "ubi-it-admin":       bank_it_admin
        "ubi-compliance":     compliance_officer

  branch:
    integration_enabled: true
    integration_type: ldap_ad
    ldap_ad:
      server_url: "ldaps://dc.unionbankofindia.local:636"
      base_dn: "DC=unionbankofindia,DC=local"
      user_search_base: "OU=BranchUsers,DC=unionbankofindia,DC=local"
      group_search_base: "OU=ASTRAGroups,DC=unionbankofindia,DC=local"
      bind_dn_secret: "secret/astra/union-bank/auth/ldap/bind_dn"
      bind_pw_secret: "secret/astra/union-bank/auth/ldap/bind_pw"
      group_role_map:
        "CN=ASTRA-BranchReviewers,OU=ASTRAGroups,DC=unionbankofindia,DC=local": ops_reviewer
        "CN=ASTRA-BranchManagers,OU=ASTRAGroups,DC=unionbankofindia,DC=local":  ops_manager

  pu:
    integration_enabled: true
    integration_type: ldap_ad
    ldap_ad:
      server_url: "ldaps://dc.unionbankofindia.local:636"
      base_dn: "DC=unionbankofindia,DC=local"
      user_search_base: "OU=PUUsers,DC=unionbankofindia,DC=local"
      group_search_base: "OU=ASTRAGroups,DC=unionbankofindia,DC=local"
      bind_dn_secret: "secret/astra/union-bank/auth/ldap/bind_dn"
      bind_pw_secret: "secret/astra/union-bank/auth/ldap/bind_pw"
      group_role_map:
        "CN=ASTRA-PUManagers,OU=ASTRAGroups,DC=unionbankofindia,DC=local": ops_manager
        "CN=ASTRA-PUEditors,OU=ASTRAGroups,DC=unionbankofindia,DC=local":  ops_reviewer

  # Union Bank sponsors 1 UCB sub-member; uses local (argon2) accounts for demo.
  smb:
    default:
      integration_enabled: false
      integration_type: local

# ── Data Centers ─────────────────────────────────────────────────────────────
datacenters:
  dc1:
    name: "Mumbai Primary Data Centre"
    location: "Mumbai, Maharashtra"
    zone: "dc1"
  dc2:
    name: "Hyderabad DR Site"
    location: "Hyderabad, Telangana"
    zone: "dc2"
    active: false

# ── NGCH Clearing Zones ───────────────────────────────────────────────────────
# Union Bank of India clears in all four NGCH zones (pan-India PSB)
clearing_zones: [WEST, SOUTH, NORTH, EAST]

